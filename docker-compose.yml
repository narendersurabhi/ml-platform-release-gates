version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MLPRG_DATABASE_URL: sqlite:///./mlprg.db
      MLPRG_ARTIFACT_STORE: s3
      MLPRG_ARTIFACT_BUCKET: mlprg-artifacts
      MLPRG_S3_ENDPOINT_URL: http://minio:9000
      MLPRG_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MLPRG_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLPRG_API_KEY: ${MLPRG_API_KEY:-dev-api-key}
    depends_on:
      - minio

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  minio-data:
